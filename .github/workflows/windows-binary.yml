# Builds the Windows (x64 and arm64, console-only) binaries. Called two ways:
#
# - by release.yml for a tag, attaching them to that release's page;
# - by hand (Actions > Windows binary > Run workflow), which builds the
#   chosen branch, keeps the binaries as a workflow artifact, and also
#   checks docs/BUILDING.md's two ways to build it. It isn't part of build.yml
#   because Windows builds are slow.
#
# Built with Visual Studio and vcpkg's static libraries and the static C++
# runtime, so QuickLogger.exe is a single file that needs no DLLs or
# Visual C++ Redistributable installed. Each is built and tested on its own
# architecture's runner.
name: Windows binary

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach to; blank builds this commit and keeps the result as an artifact.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            platform: x64
            host: Hostx64\x64
          - arch: arm64
            runner: windows-11-arm
            platform: ARM64
            host: Hostarm64\arm64
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      # The arm64 runner image may not come with vcpkg; fetch it if so.
      - name: Set up vcpkg
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path "$root\vcpkg.exe")) {
            $root = "$env:RUNNER_TEMP\vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg $root
            & "$root\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install packages
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install sqlite3 curl zlib --triplet ${{ matrix.arch }}-windows-static'

      - name: Build
        run: |
          cmake -S . -B build -A ${{ matrix.platform }} "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows-static "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(QuickLogger VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "QuickLogger-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path "dist\$name" | Out-Null
          Copy-Item build\Release\QuickLogger.exe, README.md, LICENSE, docs "dist\$name\" -Recurse
          & "dist\$name\QuickLogger.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\dist\$name.zip.sha256", "$hash  $name.zip`n")
          "NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Only Windows' own DLLs, i.e. nothing the user would have to install.
      - name: Check it needs no other DLLs
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\${{ matrix.host }}\dumpbin.exe" | Select-Object -First 1
          $dlls = & $dumpbin.FullName /dependents "dist\$env:NAME\QuickLogger.exe" | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim() }
          $dlls
          $extra = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|libcurl|sqlite|zlib)' }
          if ($extra) { Write-Error "Depends on: $extra"; exit 1 }

      - name: Attach to the release
        if: inputs.tag != ''
        run: gh release upload $env:TAG "dist\$env:NAME.zip" "dist\$env:NAME.zip.sha256" --clobber

      - name: Keep as an artifact
        if: inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.zip
            dist/${{ env.NAME }}.zip.sha256
          retention-days: 7

  # By hand only: the build both ways docs/BUILDING.md gives, Visual Studio with
  # vcpkg (preinstalled on the runner) and MSYS2's UCRT64 environment (also
  # preinstalled, at C:\msys64).
  windows-msvc:
    if: inputs.tag == ''
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3 curl zlib --triplet x64-windows'
      - name: Build
        run: |
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-mingw:
    if: inputs.tag == ''
    runs-on: windows-2025
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    env:
      MSYSTEM: UCRT64
      # Keeps the login shell in the checkout rather than $HOME.
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: pacman -Sy --needed --noconfirm git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-zlib
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
