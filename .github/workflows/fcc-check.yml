name: FCC reachability

# Can GitHub's runners download the FCC's amateur license file? Akamai
# blocks fcc.gov from some cloud networks (Vultr, for one); if GitHub's
# aren't among them, a weekly job here can mirror the file for every
# QuickLogger.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o /dev/null -w "l_amat.zip: %{http_code}\n" -r 0-0 \
            https://data.fcc.gov/download/pub/uls/complete/l_amat.zip
          curl -sSI https://data.fcc.gov/download/pub/uls/complete/l_amat.zip |
            grep -i -E "^HTTP|content-length|last-modified"
