# Builds QuickLogger and runs its tests on Linux and Windows, following the
# README's "Building QuickLogger" steps with each platform's packages as the
# README lists them, on every push and pull request to main. One job uses
# CMake 3.16, the oldest CMake the build supports.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libsqlite3-dev libcurl4-openssl-dev zlib1g-dev libssh-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  oldest-cmake:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages and CMake 3.16
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libsqlite3-dev libcurl4-openssl-dev zlib1g-dev libssh-dev
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.16.9/cmake-3.16.9-Linux-x86_64.tar.gz | tar xz -C "$HOME"
          echo "$HOME/cmake-3.16.9-Linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure

  distro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13
            image: debian:trixie
            install: apt-get update && apt-get install -y build-essential cmake git libsqlite3-dev libcurl4-openssl-dev zlib1g-dev libssh-dev
          - name: fedora
            image: fedora:latest
            install: dnf install -y gcc-c++ cmake git sqlite-devel libcurl-devel zlib-devel libssh-devel
          - name: alpine-musl
            image: alpine:latest
            install: apk add --no-cache build-base cmake git sqlite-dev curl-dev zlib-dev libssh-dev linux-headers
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: Install packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows (console only), both ways the README gives: Visual Studio with
  # vcpkg (preinstalled on the runner), and MSYS2's UCRT64 environment
  # (also preinstalled, at C:\msys64).
  windows-msvc:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3 curl zlib --triplet x64-windows'
      - name: Build
        run: |
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-mingw:
    runs-on: windows-2025
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    env:
      MSYSTEM: UCRT64
      # Keeps the login shell in the checkout rather than $HOME.
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: pacman -Sy --needed --noconfirm git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-zlib
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Linux release binaries, built and checked on other distributions,
  # kept as a workflow artifact (see linux-binary.yml).
  linux-binaries:
    uses: ./.github/workflows/linux-binary.yml

  # The Windows release binary, kept as a workflow artifact (see
  # windows-binary.yml).
  windows-binary:
    uses: ./.github/workflows/windows-binary.yml
