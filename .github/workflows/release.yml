# Builds the macOS (Apple Silicon), FreeBSD (amd64) and Linux (amd64,
# arm64 -- see linux-binary.yml) binaries for a tagged release and attaches
# them to that release's GitHub page, creating the page if it doesn't exist
# yet. The hosted server installs the FreeBSD
# one by itself (see deploy/freebsd). Runs on every pushed tag starting with "v" (e.g. v1.1.0); it can also
# be run by hand for a tag that already exists (Actions > Release binaries >
# Run workflow), which replaces the binary on that release.
name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The tag must name the version in CMakeLists.txt's project() line, so
      # the binary reports the version it's released as.
      - name: Check version
        run: |
          version=$(sed -n 's/^project(QuickLogger VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match CMakeLists.txt's version $version"
            exit 1
          fi

      # SQLite, libcurl and zlib come with macOS.
      - name: Install dependencies
        run: brew install libssh

      # Built to run on macOS 13 and later, not just the runner's version.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build build -j 3

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          name="QuickLogger-${TAG#v}-macos-arm64"
          mkdir -p "dist/$name"
          cp build/QuickLogger README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to the release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "QuickLogger ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # In a FreeBSD VM on a Linux runner. After the macOS job, which creates
  # the release page.
  freebsd:
    needs: macos
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Build and test on FreeBSD
        # Pinned to a commit. The repository's Actions settings allow only
        # GitHub's own actions plus this one, by this exact commit.
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff  # v1.5.8
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y cmake git sqlite3 curl libssh
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j 2
            ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          name="QuickLogger-${TAG#v}-freebsd-amd64"
          mkdir -p "dist/$name"
          cp build/QuickLogger README.md "dist/$name/"
          # The server scripts, which a server's updater installs too.
          cp -R deploy/freebsd "dist/$name/deploy"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to the release
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # After the macOS job, which creates the release page.
  linux:
    needs: macos
    uses: ./.github/workflows/linux-binary.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
